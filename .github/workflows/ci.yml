name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q steam_shared_library_gui.py manager_model.py commands tests
      - name: Check shell syntax
        run: |
          for script in launch-gui.sh commands/*.sh commands/proton; do
            sh -n "$script"
          done
      - name: Run ShellCheck
        run: shellcheck --exclude=SC1090,SC1091 launch-gui.sh commands/*.sh commands/proton
